packages:
  - apps/*

# --- Supply-chain hardening ---
# Only these packages may run install/postinstall lifecycle scripts.
# Everything else is blocked by default.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# Refuse to install a package version published less than 3 days ago,
# giving the ecosystem time to yank a compromised release.
minimumReleaseAge: 4320

# Re-verify installed dependencies match the lockfile before running scripts.
verifyDepsBeforeRun: install
